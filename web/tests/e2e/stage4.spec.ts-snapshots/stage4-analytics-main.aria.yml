  - heading "Analytics coverage" [level=2]
  - paragraph: Unavailable means the export cannot prove zero history.
  - list "Analytics coverage statuses":
    - listitem: Posts and albums Partial
    - listitem: Events Unavailable
  - paragraph: Coverage reflects the current export inventory; no earlier export snapshots were retained.
  - paragraph: /This is one observed export snapshot\. Prior coverage snapshots were not captured, so no historical trend is inferred\. Observed \d+-\d+-\d+\./
  - paragraph: Latest coverage-area catalog update time, not the export creation time.
  - strong: Deduplication impact
  - paragraph: /\d+ source file occurrences become \d+ unique blobs, avoiding \d+\.\d+ MiB of duplicate storage\./