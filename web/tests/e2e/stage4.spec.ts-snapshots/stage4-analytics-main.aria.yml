    - article:
      - paragraph: Classified windows
      - strong: /\d+/
      - text: Overlapping text windows in the selected period
    - article:
      - paragraph: Estimated direct-conflict rate
      - strong: /\d+\.\d+%/
      - text: /\d+ top-labelled windows/
  - img "Model-estimated direct-conflict-window rate by month":
    - paragraph: /\d+ classified windows across 1 observed time buckets; bars show sample sizes\./
  - group: Inspect conflict-rate samples
  - paragraph: "Rollup provenance: whole UTC hours overlapping the requested interval."
  - list:
    - listitem: Model estimate; no people, conversations, or relationships are ranked.
  - heading "Conversation and participant-label network" [level=2]
  - paragraph: Top retained conversation. Participant labels are provisional.
  - img "Bipartite graph of conversations and participant labels":
    - paragraph: 1 conversation nodes, 1 provisional participant-label nodes, and 1 source-membership edges.
  - group "Largest conversations represented in the graph":
    - link /Alex Example \d+ messages/:
      - /url: /conversations/one
  - heading "Topic clusters" [level=2]
  - paragraph: Unsupervised themes from a bounded sample of the active semantic text index. Labels are descriptive model estimates, never people or relationship rankings.
  - text: Unavailable
  - button "Build topics" [disabled]
  - paragraph: Build the semantic text index before generating topic clusters.
  - heading "Attachment trends over time" [level=2]
  - paragraph: Dated attachment occurrences and bytes by month in America/New_York. 0 unknown-date occurrences remain in totals but not the chart.
  - img "Attachment occurrences and bytes by month":
    - paragraph: /\d+ dated occurrences across 1 observed periods\. Missing rate 0\.0%; unlinked rate 0\.0%\./
  - paragraph: Fixture attachment timestamps.
  - heading "Attachment mix and availability" [level=2]
  - paragraph: Occurrence bytes count each send.
  - img "Attachment occurrences, unique files, and bytes by type":
    - paragraph: "/photo: \\d+ occurrences, 8 unique files, \\d+ B/"
  - img "Attachment occurrences by availability":
    - paragraph: "/resolved: \\d+ occurrences and \\d+ B/"
