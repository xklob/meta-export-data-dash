- main:
  - paragraph: Stage 5 · Destructive tools
  - heading "Deletion and quarantine" [level=1]
  - paragraph: Preview exact selections, move them into reversible logical quarantine, restore them, or explicitly hard-purge every workspace copy.
  - alert:
    - strong: Preview first. Tokens expire when the catalog changes.
    - text: Commit is reversible until hard purge. Workspace purge rewrites source JSON and removes derived indexes; it cannot erase separate backups or storage-device remnants.
