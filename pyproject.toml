[project]
name = "meta-archive-explorer"
version = "0.1.0"
description = "A private, local-first explorer for Facebook account exports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.4,<2",
  "fastapi>=0.116.1,<1",
  "fastembed>=0.8.0,<0.9",
  "faster-whisper>=1.2.1,<2",
  "ftfy>=6.3.1,<7",
  "lancedb>=0.34.0,<0.35",
  "lingua-language-detector>=2.1.1,<3",
  "openai>=2.46.0,<3",
  "orjson>=3.11.1,<4",
  "psutil>=7.0.0,<8",
  "pydantic-settings>=2.10.1,<3",
  "pypdf>=6.15.0,<7",
  "python-magic>=0.4.27,<1",
  "rich>=14.1.0,<15",
  "sqlalchemy>=2.0.41,<3",
  "transformers>=4.53,<6",
  "torch>=2.7,<3",
  "typer>=0.16.0,<1",
  "uvicorn[standard]>=0.35.0,<1",
  "scikit-learn>=1.7,<2",
]

[project.scripts]
meta-archive = "meta_archive.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "hypothesis>=6.136.6,<7",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_archive"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: requires a temporary on-disk archive",
  "real_export: reads the local Facebook export and may take several minutes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "UP007", "UP035"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/meta_archive"]
mypy_path = "src"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
